<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">STK RevM20 electrochemical instrument architecture</title>
  <desc id="desc">A shared electrochemical cell feeds continuous OPA2320 current amplifiers and an OPA391 pH buffer, followed by simultaneous ADS131M04 conversion. DAC80508 sets working potentials. One reference and counter loop is shared. A separate ADS124S06 voltage ADC serves selected-channel experimental EIS.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#146d68"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#173a3b}.small{font-size:18px;fill:#486867}.body{font-size:22px}.label{font-size:24px;font-weight:700}.line{fill:none;stroke:#146d68;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#a9cfca;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="700" rx="20" fill="#edf6f3"/>
  <text x="48" y="59" font-size="34" font-weight="700">STK RevM20</text>
  <text x="48" y="92" class="body">Simultaneous current acquisition in a shared electrochemical cell</text>
  <rect x="884" y="31" width="268" height="37" rx="18" fill="#d5e9e1"/>
  <text x="901" y="56" class="small">CAD BASELINE · FW18</text>
  <rect x="46" y="145" width="230" height="362" rx="12" fill="#dbece5" stroke="#89b8a7" stroke-width="2"/>
  <text x="67" y="181" class="label">Shared cell</text>
  <text x="67" y="228" class="body">WE1 / WE2 / WE3</text>
  <text x="67" y="281" class="body">pH electrode</text>
  <text x="67" y="390" class="body">Reference (RE)</text>
  <text x="67" y="446" class="body">Counter (CE)</text>
  <text x="67" y="480" class="small">One common pair</text>
  <rect x="330" y="145" width="280" height="123" rx="12" class="box"/>
  <text x="350" y="182" class="label">OPA2320 TIAs</text>
  <text x="350" y="217" class="body">Continuous current paths</text>
  <text x="350" y="246" class="small">ADG704 feedback ranges</text>
  <path d="M276 219H330" class="line"/>
  <rect x="330" y="292" width="280" height="78" rx="12" class="box"/>
  <text x="350" y="325" class="label">OPA391 pH buffer</text>
  <text x="350" y="354" class="small">High impedance / driven guard</text>
  <path d="M276 280H300V331H330" class="line"/>
  <rect x="685" y="174" width="230" height="151" rx="12" class="box"/>
  <text x="705" y="211" class="label">ADS131M04</text>
  <text x="705" y="247" class="body">4 simultaneous</text>
  <text x="705" y="276" class="body">ADC channels</text>
  <text x="705" y="305" class="small">0.5 input conditioning</text>
  <path d="M610 218H685" class="line"/>
  <path d="M610 331H651V298H685" class="line"/>
  <rect x="966" y="174" width="190" height="151" rx="12" class="box"/>
  <text x="986" y="214" class="label">ESP32-S3</text>
  <text x="986" y="250" class="body">USB Serial</text>
  <text x="986" y="286" class="small">FW18 control</text>
  <path d="M915 248H966" class="line"/>
  <rect x="685" y="375" width="230" height="132" rx="12" class="box"/>
  <text x="705" y="412" class="label">DAC80508</text>
  <text x="705" y="448" class="body">WE setpoints</text>
  <text x="705" y="482" class="small">16-bit command path</text>
  <path d="M1060 325V441H915" class="line"/>
  <path d="M685 409H636V130H470V145" class="line"/>
  <rect x="330" y="398" width="280" height="109" rx="12" class="box"/>
  <text x="350" y="434" class="label">RE buffer / CE loop</text>
  <text x="350" y="469" class="body">Shared potential control</text>
  <path d="M276 385H314V416H330" class="line"/>
  <path d="M330 480H305V445H276" class="line"/>
  <rect x="46" y="539" width="1108" height="74" rx="12" fill="#fff" stroke="#a9cfca" stroke-width="2"/>
  <text x="67" y="570" class="body">Experimental EIS: buffered WE−RE → ADS124S06 → MCU</text>
  <text x="67" y="597" class="small">Selected voltage channel; separate ADC timing. Physical magnitude and phase accuracy pending.</text>
  <text x="49" y="655" class="body">3CA + pH default · 4-layer FPC · 41.8 × 42.5 mm · physical characterization pending</text>
</svg>
