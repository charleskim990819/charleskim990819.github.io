    Research Areas:
      - title: Liquid-Metal Materials
        summary: >
          Catechol-Ga³⁺ chelation chemistry for sintering-free, primer-free EGaIn inks
          (PDA-LM). DFT (ORCA r2SCAN-3c) studies of amorphous Ga₂O₃ surface adhesion.
      - title: Wearable Bioelectronics
        summary: >
          Stretchable / tattoo-sticker form factors integrating AD5941 (EC),
          ADS131M08 (EEG/EMG), and RHS2116 (neurostim). Apollo510 / DA14531 BLE.
      - title: Electrochemical Biosensors
        summary: >
          AD5941-based 4-channel portable potentiostat (CV / amperometry / EIS / OCP).
          DIY SEBS-based screen-printed electrodes; Na⁺ ion-selective sensing.
      - title: Biointerface Coatings
        summary: >
          PDRN + lubricant dual coatings for anti-fouling and tissue regeneration
          on suture and intramuscular EMG electrodes.

